<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Luziflor Gestão</title>
  <base href="/">
  <!-- Sem maximum-scale: o zoom fica sempre liberado (acessibilidade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A3195B">
  <meta name="description" content="Controle de estoque, vendas e fiado da Luziflor Modas">
  <!-- Content Security Policy (RNF02): scripts só do próprio domínio. Troque a URL da API se mudar o servidor. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.onrender.com http://localhost:8000; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar o aplicativo.</noscript>
</body>
</html>
